name: Build iOS xcframeworks (hard-coded to godot-storekit2)

on:
  push:
    tags: ["v*"]     # e.g. v0.2.5
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        config: [Debug, Release]

    env:
      PROJECT_FILE: godot-storekit2.xcodeproj
      SCHEME_NAME: godot-storekit2
      OUTDIR: dist/${{ matrix.config }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.x"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (device, iOS)
        run: |
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration ${{ matrix.config }} \
            -destination "generic/platform=iOS" \
            -archivePath build/ios-${{ matrix.config }} \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Archive (simulator)
        run: |
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration ${{ matrix.config }} \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/iossim-${{ matrix.config }} \
            SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # Find the produced .frameworks (prefer ones matching the scheme, else first)
      - name: Create .xcframework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"

          echo "Device products:"
          find build/ios-${{ matrix.config }}/Products -type d -name "*.framework" -maxdepth 6 | sort
          echo "Simulator products:"
          find build/iossim-${{ matrix.config }}/Products -type d -name "*.framework" -maxdepth 6 | sort

          dev_fw="$(find build/ios-${{ matrix.config }}/Products -type d -name "${SCHEME_NAME}.framework" -maxdepth 6 | head -n1 || true)"
          sim_fw="$(find build/iossim-${{ matrix.config }}/Products -type d -name "${SCHEME_NAME}.framework" -maxdepth 6 | head -n1 || true)"

          # Fallback to first framework if names differ from scheme
          if [ -z "$dev_fw" ]; then dev_fw="$(find build/ios-${{ matrix.config }}/Products -type d -name "*.framework" -maxdepth 6 | head -n1 || true)"; fi
          if [ -z "$sim_fw" ]; then sim_fw="$(find build/iossim-${{ matrix.config }}/Products -type d -name "*.framework" -maxdepth 6 | head -n1 || true)"; fi

          if [ -z "$dev_fw" ] || [ -z "$sim_fw" ]; then
            echo "::error::Could not find a pair of .frameworks in the archives."
            exit 65
          fi

          fwname="$(basename "$dev_fw" .framework)"
          echo "Using framework name: $fwname"
          xcodebuild -create-xcframework \
            -framework "$dev_fw" \
            -framework "$sim_fw" \
            -output "$OUTDIR/${fwname}.xcframework"

          echo "framework_name=$fwname" >> "$GITHUB_OUTPUT"

      - name: Copy or generate .gdip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          fwname="$(basename "$(find "$OUTDIR" -maxdepth 1 -name '*.xcframework' | head -n1)" .xcframework)"
          gdip="$(git ls-files '*.gdip' | head -n1 || true)"
          if [ -n "$gdip" ]; then
            cp "$gdip" "$OUTDIR"/
          else
            printf '%s\n' \
              '{' \
              "  \"name\": \"${fwname}\"," \
              '  "version": "0.2",' \
              '  "author": "BlooRabbit",' \
              '  "platform": "ios",' \
              "  \"binary\": \"${fwname}.xcframework\"," \
              "  \"classes\": [\"GodotStoreKit2\"]" \
              '}' > "$OUTDIR/${fwname}.gdip"
          fi

      - name: Package as ios/plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-${{ matrix.config }}/ios/plugins
          cp -R "$OUTDIR"/*.xcframework package-${{ matrix.config }}/ios/plugins/
          cp "$OUTDIR"/*.gdip package-${{ matrix.config }}/ios/plugins/
          (cd package-${{ matrix.config }} && zip -r "../${SCHEME_NAME}-${{ matrix.config }}.zip" ios)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME_NAME }}-${{ matrix.config }}
          path: |
            ${{ env.OUTDIR }}
            ${{ env.SCHEME_NAME }}-${{ matrix.config }}.zip
